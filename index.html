<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abdullrahman Eissa | Digital Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 16px 110px;
      position: relative;
      overflow-x: hidden;
    }

    /* إضاءة زرقاء خفيفة ورا الكارت */
    .glow-top {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(0, 119, 255, 0.28) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* حاوية الموج المتحرك (أزرق وأبيض) */
    .waves-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 150px;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .waves {
      width: 100%;
      height: 100%;
    }

    .parallax > use {
      animation: moveWaves 14s cubic-bezier(0.55, 0.5, 0.45, 0.5) infinite;
    }
    .parallax > use:nth-child(1) {
      animation-delay: -2s;
      animation-duration: 7s;
    }
    .parallax > use:nth-child(2) {
      animation-delay: -3s;
      animation-duration: 10s;
    }
    .parallax > use:nth-child(3) {
      animation-delay: -4s;
      animation-duration: 13s;
    }
    .parallax > use:nth-child(4) {
      animation-delay: -5s;
      animation-duration: 20s;
    }

    @keyframes moveWaves {
      0% { transform: translate3d(-90px, 0, 0); }
      100% { transform: translate3d(85px, 0, 0); }
    }

    /* الكارت الرئيسي */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(10, 14, 24, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 28px;
      padding: 32px 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 102, 255, 0.12);
      animation: cardEnter 0.6s ease-out forwards;
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* الصورة الشخصية */
    .avatar-box {
      position: relative;
      width: 122px;
      height: 122px;
      margin: 0 auto 14px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #0077ff, #ffffff, #0077ff);
      background-size: 200% 200%;
      animation: borderPulse 4s ease infinite;
      box-shadow: 0 0 28px rgba(0, 119, 255, 0.45);
    }

    @keyframes borderPulse {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      background-color: #000;
      display: block;
    }

    .name {
      font-size: 1.45rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .title-badge {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
      letter-spacing: 0.4px;
    }

    /* زرار حفظ جهة الاتصال */
    .save-btn {
      width: 100%;
      background: linear-gradient(135deg, #ffffff 0%, #dbeafe 100%);
      color: #020617;
      border: none;
      padding: 14px 18px;
      border-radius: 16px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      box-shadow: 0 8px 22px rgba(255, 255, 255, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(56, 189, 248, 0.35);
    }

    .save-btn:active {
      transform: scale(0.97);
    }

    /* الحقول الملونة بلون كل منصة */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-radius: 16px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.96rem;
      opacity: 0;
      animation: slideUp 0.5s ease forwards;
      transition: transform 0.22s ease, filter 0.22s ease, box-shadow 0.22s ease;
    }

    .field:nth-child(1) { animation-delay: 0.1s; }
    .field:nth-child(2) { animation-delay: 0.18s; }
    .field:nth-child(3) { animation-delay: 0.26s; }
    .field:nth-child(4) { animation-delay: 0.34s; }
    .field:nth-child(5) { animation-delay: 0.42s; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .field:hover {
      transform: translateY(-3px) scale(1.01);
      filter: brightness(1.1);
    }

    .field:active {
      transform: scale(0.98);
    }

    .field-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .field svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .arrow-icon {
      width: 18px !important;
      height: 18px !important;
      opacity: 0.85;
      transition: transform 0.2s ease;
    }

    .field:hover .arrow-icon {
      transform: translateX(-4px);
    }

    /* ألوان الحقول بنفس لون أيقونة كل موقع */
    .whatsapp {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      box-shadow: 0 8px 20px -4px rgba(37, 211, 102, 0.45);
    }

    .linkedin {
      background: linear-gradient(135deg, #0A66C2 0%, #004182 100%);
      box-shadow: 0 8px 20px -4px rgba(10, 102, 194, 0.5);
    }

    .github {
      background: linear-gradient(135deg, #2b3137 0%, #161b22 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 20px -4px rgba(255, 255, 255, 0.12);
    }

    .medium {
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      color: #000000;
      box-shadow: 0 8px 20px -4px rgba(255, 255, 255, 0.3);
    }

    .email {
      background: linear-gradient(135deg, #EA4335 0%, #b91c1c 100%);
      box-shadow: 0 8px 20px -4px rgba(234, 67, 53, 0.45);
    }
  </style>
</head>
