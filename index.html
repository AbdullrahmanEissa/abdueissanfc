  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #050810;
      --panel: rgba(11, 17, 31, .78);
      --text: #f8fafc;
      --muted: #a8b5ca;
      --blue: #1688ff;
      --cyan: #52e4ff;
      --line: rgba(104, 183, 255, .24);
      --ease: cubic-bezier(.2, .75, .25, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 16px 150px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(0, 102, 255, .14), transparent 42%),
        radial-gradient(ellipse at 0% 70%, rgba(0, 217, 255, .06), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: "Cairo", system-ui, sans-serif;
    }

    a, button { -webkit-tap-highlight-color: transparent; }
    a:focus-visible, button:focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 4px;
    }

    .ambient {
      position: fixed;
      z-index: -1;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      filter: blur(75px);
      opacity: .22;
      pointer-events: none;
      animation: ambientFloat 12s ease-in-out infinite alternate;
    }
    .ambient--one { top: -190px; left: calc(50% - 180px); background: #087cff; }
    .ambient--two { right: -250px; bottom: 5%; background: #00d9ff; animation-delay: -5s; }

    .card {
      width: min(100%, 430px);
      position: relative;
      z-index: 2;
      padding: 30px 21px 24px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(15, 24, 43, .91), var(--panel));
      -webkit-backdrop-filter: blur(22px);
      backdrop-filter: blur(22px);
      box-shadow: 0 28px 90px rgba(0, 0, 0, .48), inset 0 1px rgba(255, 255, 255, .055);
      opacity: 0;
      transform: translateY(24px) scale(.97);
      animation: cardEnter .85s var(--ease) .12s forwards;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(82, 228, 255, .5), transparent 35%, rgba(22, 136, 255, .28));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* الصورة وحلقة المهارات الدائرية */
    .profile-stage {
      width: 300px;
      height: 300px;
      max-width: 100%;
      margin: -4px auto 7px;
      position: relative;
      display: grid;
      place-items: center;
      isolation: isolate;
    }
    .orbit {
      position: absolute;
      inset: 10px;
      border: 1px dashed rgba(82, 228, 255, .34);
      border-radius: 50%;
      animation: orbitSpin 32s linear infinite;
    }
    .orbit::before, .orbit::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 14px var(--cyan);
    }
    .orbit::before { width: 7px; height: 7px; top: 16%; left: 12%; }
    .orbit::after { width: 5px; height: 5px; right: 7%; bottom: 24%; background: var(--blue); }

    .avatar-halo {
      position: absolute;
      width: 154px;
      height: 154px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--blue), var(--cyan), #fff, var(--blue));
      padding: 3px;
      box-shadow: 0 0 35px rgba(22, 136, 255, .3);
      animation: haloPulse 4s ease-in-out infinite;
    }
    .avatar-halo::before {
      content: "";
      position: absolute;
      inset: -8px;
      border: 1px solid rgba(82, 228, 255, .2);
      border-radius: inherit;
    }
    .avatar {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      background: #080d18;
      border: 4px solid #0b1220;
    }

    .orbit-badge {
      --angle: 0deg;
      position: absolute;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 148px;
      padding: 7px 11px;
      border: 1px solid rgba(103, 195, 255, .35);
      border-radius: 999px;
      color: #eaf7ff;
      background: rgba(7, 16, 31, .94);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35), 0 0 16px rgba(22, 136, 255, .12);
      font: 700 11px/1.25 "Cairo", sans-serif;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(12px) scale(.65);
      animation: badgePop .55s var(--ease) forwards;
    }
    .orbit-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }
    .badge-1 { top: 8px; left: 50%; animation-delay: .65s; }
    .badge-2 { top: 52px; right: -3px; animation-delay: .82s; }
    .badge-3 { top: 112px; right: -15px; animation-delay: .99s; }
    .badge-4 { bottom: 77px; right: -7px; animation-delay: 1.16s; }
    .badge-5 { bottom: 20px; left: 50%; animation-delay: 1.33s; }
    .badge-6 { bottom: 75px; left: -7px; animation-delay: 1.5s; }
    .badge-7 { top: 112px; left: -15px; animation-delay: 1.67s; }
    .badge-8 { top: 52px; left: -3px; animation-delay: 1.84s; }

    .name {
      margin: 3px 0 4px;
      font-size: clamp(1.45rem, 5vw, 1.7rem);
      line-height: 1.5;
      font-weight: 900;
      letter-spacing: -.4px;
    }
    .subtitle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 19px;
      padding: 5px 13px;
      border: 1px solid rgba(82, 228, 255, .25);
      border-radius: 999px;
      background: rgba(14, 165, 233, .09);
      color: var(--cyan);
      direction: ltr;
      font-size: .79rem;
      font-weight: 700;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px rgba(74, 222, 128, .8);
      animation: statusPulse 1.8s ease-in-out infinite;
    }

    .save-btn {
      width: 100%;
      min-height: 53px;
      margin: 0 0 19px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 16px;
      color: #06101f;
      background: linear-gradient(120deg, #fff, #c9edff 55%, #fff);
      background-size: 200% 100%;
      box-shadow: 0 9px 26px rgba(82, 190, 255, .15);
      font: 800 .94rem "Cairo", sans-serif;
      cursor: pointer;
      transition: transform .22s var(--ease), box-shadow .22s ease, background-position .5s ease;
    }
    .save-btn:hover { transform: translateY(-3px); box-shadow: 0 13px 32px rgba(82, 190, 255, .25); background-position: 100% 0; }
    .save-btn:active { transform: scale(.98); }
    .save-btn svg { width: 21px; height: 21px; flex: 0 0 auto; }

    .links { display: grid; gap: 11px; }
    .field {
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 16px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 16px;
      color: #fff;
      text-decoration: none;
      font-size: .93rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(13px);
      animation: linkEnter .55s var(--ease) forwards;
      transition: transform .22s var(--ease), filter .22s ease, box-shadow .22s ease;
    }
    .field:nth-child(1) { animation-delay: .25s; }
    .field:nth-child(2) { animation-delay: .33s; }
    .field:nth-child(3) { animation-delay: .41s; }
    .field:nth-child(4) { animation-delay: .49s; }
    .field:nth-child(5) { animation-delay: .57s; }
    .field:hover { transform: translateY(-3px) scale(1.012); filter: brightness(1.1); }
    .field:active { transform: scale(.985); }
    .field-right { display: flex; align-items: center; gap: 12px; }
    .field svg { width: 23px; height: 23px; flex-shrink: 0; fill: currentColor; }
    .arrow-icon { width: 18px !important; height: 18px !important; opacity: .8; transition: transform .2s ease; }
    .field:hover .arrow-icon { transform: translateX(-4px); }

    .whatsapp { background: linear-gradient(120deg, #20c968, #087d6d); box-shadow: 0 7px 19px rgba(37, 211, 102, .13); }
    .linkedin { background: linear-gradient(120deg, #0a66c2, #06417d); box-shadow: 0 7px 19px rgba(10, 102, 194, .15); }
    .github { background: linear-gradient(120deg, #303943, #171c25); }
    .medium { background: linear-gradient(120deg, #fff, #cbd5e1); color: #080b11; }
    .email { background: linear-gradient(120deg, #ed493c, #a91f28); }

    .footer-note { margin-top: 18px; color: var(--muted); font-size: .72rem; opacity: .8; }

    .waves-wrapper {
      position: fixed;
      z-index: -1;
      inset: auto 0 0;
      height: 145px;
      overflow: hidden;
      pointer-events: none;
      opacity: .8;
      mask-image: linear-gradient(to bottom, transparent, #000 32%);
    }
    .waves { width: 100%; height: 100%; }
    .parallax > use { animation: waveMove 16s cubic-bezier(.55, .5, .45, .5) infinite; }
    .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
    .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
    .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
    .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }

    @keyframes cardEnter { to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes badgePop {
      0% { opacity: 0; transform: translateY(12px) scale(.65); }
      75% { opacity: 1; transform: translateY(-2px) scale(1.05); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes linkEnter { to { opacity: 1; transform: translateY(0); } }
    @keyframes orbitSpin { to { transform: rotate(360deg); } }
    @keyframes haloPulse { 0%, 100% { box-shadow: 0 0 25px rgba(22,136,255,.24); } 50% { box-shadow: 0 0 43px rgba(82,228,255,.38); } }
    @keyframes statusPulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes ambientFloat { from { transform: translate3d(-10px, 0, 0) scale(.92); } to { transform: translate3d(18px, 25px, 0) scale(1.08); } }
    @keyframes waveMove { 0% { transform: translate3d(-90px, 0, 0); } 100% { transform: translate3d(85px, 0, 0); } }

    @media (max-width: 380px) {
      body { padding: 28px 11px 125px; }
      .card { padding: 25px 15px 20px; border-radius: 25px; }
      .profile-stage { width: 270px; height: 270px; }
      .avatar-halo { width: 137px; height: 137px; }
      .orbit-badge { padding: 6px 8px; font-size: 10px; }
      .badge-2, .badge-8 { top: 48px; }
      .badge-3, .badge-7 { top: 103px; }
      .badge-4, .badge-6 { bottom: 68px; }
      .badge-5 { bottom: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
      .card, .field, .orbit-badge { opacity: 1; transform: none; }
    }
  </style>
</head>

      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  </script>
</body>
